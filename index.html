<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>茶船古道・六堡春秋 — 六堡茶全产业链科普模拟小游戏</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2F5D43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="六堡春秋">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="14" y="34" width="62" height="9" rx="4.5" fill="%232f5d43"/><path d="M22 43h50a27 27 0 0 1-50 0z" fill="%238a5a2b"/><path d="M72 46h11a9 9 0 0 1 0 18h-10" fill="none" stroke="%238a5a2b" stroke-width="7" stroke-linecap="round"/><path d="M36 16c-2 7 4 7 2 14M56 16c-2 7 4 7 2 14M46 9c-2 7 4 7 2 14" stroke="%23b3a98f" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>'>
<style>
/* ===== 基础 ===== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f4ecd8; --paper2:#eadcbb; --card:#faf5e6;
  --ink:#3b3226; --ink2:#77684f;
  --green:#2f5d43; --leaf:#5f8f5e; --brown:#8a5a2b; --gold:#c9a15f;
  --red:#b0492e; --line:#cdbb8d;
  --kaiti:'KaiTi','STKaiti','楷体','FZKai-Z03','Noto Serif SC','SimSun',serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--kaiti); color:var(--ink); background:var(--paper);
  background-image:radial-gradient(rgba(138,90,43,.06) 1px,transparent 1px);
  background-size:26px 26px; min-height:100vh; letter-spacing:.5px;
}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none;font-size:1rem}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
#app{max-width:1080px;margin:0 auto;padding:14px 14px 40px}
@media (min-width:768px){#app{padding:22px 28px 60px}}

/* ===== 通用组件 ===== */
.btn-primary{
  display:inline-block;background:var(--green);color:#f6efdc;font-size:1.15rem;
  padding:14px 46px;border-radius:8px;letter-spacing:6px;text-indent:6px;
  border:1px solid var(--green);box-shadow:0 3px 0 rgba(47,93,67,.35);
  transition:transform .12s,box-shadow .12s,background .12s;
}
.btn-primary:hover{background:#3a6f51}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(47,93,67,.35)}
.btn-ghost{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:.92rem;color:var(--ink2)}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}
.frame{border:1px solid var(--line);outline:1px solid var(--line);outline-offset:5px;border-radius:10px}

/* ===== 顶栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.dots{display:flex;gap:8px;align-items:center}
.dots .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--brown);background:var(--card);position:relative}
.dots .dot.done{background:var(--green);border-color:var(--green)}
.dots .dot.cur{box-shadow:0 0 0 4px rgba(201,161,95,.45);background:var(--gold);border-color:var(--brown)}
.dots .dot small{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:.68rem;color:var(--ink2);white-space:nowrap;margin-top:3px;letter-spacing:0}
.scorebox{font-size:.95rem;color:var(--ink2)}
.scorebox b{font-size:1.25rem;color:var(--red);font-weight:normal}

/* ===== 游戏主区 ===== */
.game-wrap{display:grid;grid-template-columns:1fr;background:var(--card);overflow:hidden;box-shadow:0 8px 30px rgba(90,70,30,.18)}
@media (min-width:860px){.game-wrap{grid-template-columns:1.1fr 1fr}}
.scene-box{position:relative;overflow:hidden;background:#dce7d2;aspect-ratio:16/10}
.scene-box .scene-img{width:100%;height:100%;object-fit:cover;object-position:left center;display:block}
.scene-box .scene-shade{position:absolute;top:0;right:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(250,245,230,.55))}
.scene-box .scene-chip{position:absolute;top:12px;left:12px;background:rgba(47,93,67,.82);color:#f4ecd8;font-size:.85rem;padding:6px 14px;border-radius:20px;letter-spacing:1px}
.scene-box .scene-tag{position:absolute;bottom:12px;left:12px;right:12px;color:#f4ecd8;text-shadow:0 1px 6px rgba(30,40,25,.75);font-size:.9rem;line-height:1.5}
@media (min-width:860px){.scene-box{aspect-ratio:1/1;max-height:560px}}
.panel{padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px;min-height:340px}
@media (min-width:860px){.panel{padding:26px 24px}}
.panel-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--line);padding-bottom:10px}
.stage-no{font-size:.85rem;color:var(--brown);border:1px solid var(--gold);border-radius:4px;padding:2px 8px;white-space:nowrap}
.panel-head h2{font-size:1.5rem;color:var(--green);letter-spacing:3px;font-weight:normal}
.sub-prog{margin-left:auto;font-size:.85rem;color:var(--ink2)}
.scene-text{font-size:1.02rem;line-height:1.8;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;font-size:1rem;line-height:1.6;transition:border-color .15s,background .15s,transform .1s;
  display:flex;gap:10px;align-items:flex-start;
}
.opt:hover{border-color:var(--green);background:#f2ecd8}
.opt:active{transform:scale(.99)}
.opt .no{flex:0 0 24px;height:24px;border:1px solid var(--brown);border-radius:50%;color:var(--brown);font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:2px}
.opt.bad{border-color:var(--red);background:#f7e6dc;animation:shake .35s}
.opt.bad .no{border-color:var(--red);color:var(--red);background:var(--red);color:#fff}
.opt.good{border-color:var(--green);background:#eaf2e2}
.opt:disabled{cursor:default;opacity:.75}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{min-height:26px;font-size:.95rem;line-height:1.6;color:var(--red);border-radius:6px;padding:8px 12px}
.hint.ok{color:var(--green);background:#eaf2e2}
.hint:empty{display:none}

/* ===== 滑块关 ===== */
.slider-row{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr;gap:8px;background:var(--card)}
.slider-row.bad{border-color:var(--red);background:#f9ebe2}
.slider-head{display:flex;justify-content:space-between;align-items:center}
.slider-head .nm{font-size:1.02rem}
.slider-head .val{color:var(--red);font-size:1.05rem}
input[type=range]{width:100%;accent-color:var(--green);height:26px;cursor:pointer}
.slider-err{font-size:.88rem;color:var(--red);line-height:1.5}
.slider-err:empty{display:none}

/* ===== 品茶关 ===== */
.taste-grid{display:flex;flex-direction:column;gap:10px}
.taste-btn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--card);text-align:left;font-size:1.02rem}
.taste-btn:hover{border-color:var(--gold)}
.taste-btn.done{border-color:var(--green);background:#eaf2e2}
.swatch{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid rgba(90,60,30,.3)}
.taste-note{margin-top:2px;border-left:4px solid var(--gold);background:#f6edd9;padding:10px 14px;line-height:1.75;font-size:.98rem;border-radius:0 6px 6px 0}
.taste-note b{color:var(--green)}
.quiz-lock{font-size:.9rem;color:var(--ink2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}

/* ===== 双线卖茶关 ===== */
.line-tabs{display:flex;gap:10px;flex-wrap:wrap}
.line-tab{flex:1 1 200px;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;background:var(--card);display:flex;flex-direction:column;gap:6px}
.line-tab:hover{border-color:var(--green)}
.line-tab.on{border-color:var(--green);background:#eaf2e2;box-shadow:inset 0 0 0 1px var(--green)}
.line-tab b{font-size:1.05rem;color:var(--green)}
.line-tab small{color:var(--ink2);line-height:1.5}
.line-tab .flag{margin-left:auto;color:var(--green);font-size:.9rem}
.line-back{font-size:.9rem;color:var(--brown);border-bottom:1px dashed var(--brown);align-self:flex-start;padding-bottom:2px}
.line-back:hover{color:var(--red);border-color:var(--red)}

/* ===== 知识弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(45,38,26,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:-6px;border-radius:12px;max-width:460px;width:100%;padding:28px 24px 22px;text-align:center;animation:pop .28s;position:relative;max-height:86vh;overflow:auto}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-seal{width:46px;height:46px;margin:0 auto 12px;background:var(--red);color:#f6efdc;border-radius:8px;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);box-shadow:0 2px 6px rgba(120,50,30,.3)}
.modal h3{font-size:1.25rem;color:var(--green);letter-spacing:2px;font-weight:normal;margin-bottom:12px}
.modal p{font-size:1rem;line-height:2;color:var(--ink);text-align:left}
.modal .btn-primary{margin-top:18px;font-size:1rem;padding:11px 40px}

/* ===== 通关横幅 ===== */
.clear-overlay{position:fixed;inset:0;background:rgba(250,245,230,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;text-align:center;animation:fadeIn .3s}
.clear-overlay .big{font-size:2rem;color:var(--green);letter-spacing:4px;animation:pop .4s}
.clear-overlay .sub{font-size:1.05rem;color:var(--brown);letter-spacing:2px}

/* ===== 开始页 ===== */
.hero{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 34px rgba(90,70,30,.2)}
.hero svg{display:block;width:100%;height:auto;max-height:480px}
.hero-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(244,236,216,.0),rgba(244,236,216,.0) 55%,rgba(244,236,216,.82))}
.hero-kicker{font-size:.9rem;color:var(--brown);letter-spacing:4px;margin-bottom:10px;background:rgba(244,236,216,.8);padding:4px 14px;border-radius:20px;border:1px solid var(--line)}
.hero-overlay h1{font-size:2.5rem;line-height:1.25;color:var(--green);letter-spacing:8px;text-shadow:0 2px 10px rgba(244,236,216,.9);font-weight:normal}
@media (min-width:768px){.hero-overlay h1{font-size:3.6rem}}
.hero-sub{max-width:560px;font-size:.98rem;line-height:1.9;color:var(--ink);margin:12px 0 18px;text-shadow:0 1px 4px rgba(244,236,216,.9)}
.intro{margin-top:26px}
.intro h2{font-size:1.3rem;color:var(--green);letter-spacing:3px;text-align:center;margin-bottom:16px;font-weight:normal;position:relative}
.intro h2::before,.intro h2::after{content:"";display:inline-block;width:34px;height:1px;background:var(--line);vertical-align:middle;margin:0 12px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:768px){.cards{grid-template-columns:repeat(5,1fr)}}
.card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.card svg{width:44px;height:44px}
.card b{font-size:1.02rem;color:var(--green);letter-spacing:1px;font-weight:normal}
.card small{font-size:.82rem;color:var(--ink2);line-height:1.6}
.help{margin-top:18px;text-align:center;font-size:.9rem;color:var(--ink2);line-height:1.9;border-top:1px dashed var(--line);padding-top:14px}

/* ===== 结算页 ===== */
.result-head{text-align:center;padding:26px 16px 10px}
.seal{width:96px;height:96px;margin:0 auto 16px;background:var(--red);color:#f6efdc;border-radius:50%;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;font-size:1.35rem;letter-spacing:1px;transform:rotate(-7deg);box-shadow:0 4px 12px rgba(120,50,30,.35)}
.rank-name{font-size:1.8rem;color:var(--green);letter-spacing:4px;margin-top:6px}
.rank-desc{color:var(--brown);letter-spacing:2px;margin-top:6px}
.stats{display:flex;justify-content:center;gap:34px;margin:20px 0;flex-wrap:wrap}
.stats div{text-align:center}
.stats .n{font-size:1.6rem;color:var(--red)}
.stats .l{font-size:.85rem;color:var(--ink2);letter-spacing:1px}
.stars{display:flex;justify-content:center;gap:6px;margin-top:2px}
.stars svg{width:26px;height:26px}
.stage-chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.stage-chips span{border:1px solid var(--line);border-radius:20px;padding:4px 14px;font-size:.85rem;color:var(--ink2);background:var(--card)}
.stage-chips span.on{border-color:var(--green);color:var(--green);background:#eaf2e2}
.history{margin-top:30px}
.history h2{font-size:1.35rem;color:var(--green);letter-spacing:3px;text-align:center;font-weight:normal;margin-bottom:8px;position:relative}
.history h2::before,.history h2::after{content:"";display:inline-block;width:40px;height:1px;background:var(--line);vertical-align:middle;margin:0 12px}
.hscroll{position:relative;overflow-x:auto;padding:6px 8px 16px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--gold) transparent;-webkit-overflow-scrolling:touch}
.hline{position:absolute;left:8px;right:8px;top:26px;height:2px;background:var(--line);pointer-events:none}
.hnodes{display:flex;min-width:max-content;padding:0 12px}
.hnode{flex:0 0 205px;scroll-snap-align:center;padding:0 10px;text-align:center}
.hnode .dot{width:14px;height:14px;border-radius:50%;background:var(--green);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--green);margin:20px auto 12px}
.hnode .yr{font-size:1.05rem;color:var(--brown);letter-spacing:1px}
.hnode .tt{font-size:1.02rem;color:var(--green);margin:4px 0}
.hnode .dd{font-size:.85rem;color:var(--ink2);line-height:1.7}
.hnav{display:flex;justify-content:center;gap:14px;margin-top:4px}
.hnav button{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:var(--card);font-size:1.1rem;color:var(--green)}
.hnav button:hover{border-color:var(--green);background:#eaf2e2}
.result-actions{display:flex;justify-content:center;gap:16px;margin-top:26px;flex-wrap:wrap}
.result-actions .btn-primary{padding:12px 38px}

/* ===== 动效（默认开，低动效关闭） ===== */
.cloud{animation:drift 26s linear infinite}
.cloud.c2{animation-duration:34s;animation-delay:-12s}
.cloud.c3{animation-duration:42s;animation-delay:-24s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1240px)}}
.steam path{animation:rise 3.2s ease-in-out infinite;transform-origin:center}
.steam path:nth-child(2){animation-delay:1s}
.steam path:nth-child(3){animation-delay:2s}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.9)}35%{opacity:.85}100%{opacity:0;transform:translateY(-16px) scale(1.05)}}
.leaf{animation:fall 7s linear infinite}
.leaf.l2{animation-delay:2.4s}
.leaf.l3{animation-delay:4.6s}
.leaf.l4{animation-delay:1.2s}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}12%{opacity:.9}100%{transform:translate(-40px,300px) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.steam path,.leaf{animation:none}}
</style>
</head>

function renderGame(){
  const st=CONFIG.stages[S.stage];
  const dots=CONFIG.stages.map(function(s,i){
    const cls=i<S.stage?'dot done':(i===S.stage?'dot cur':'dot');
    return '<span class="'+cls+'"><small>'+s.id+'</small></span>';
  }).join('');
  let body='';
  if(!st.type){body=quizBody(st);}
  else if(st.type==='sliders'){body=slidersBody(st);}
  else if(st.type==='taste'){body=tasteBody(st);}
  else if(st.type==='dual'){body=dualBody(st);}
  app.innerHTML=
  '<div class="topbar">'+
    '<button class="btn-ghost" type="button" onclick="goHome()">主菜单</button>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="scorebox">品质分 <b>'+S.score+'</b></div>'+
  '</div>'+
  '<div class="game-wrap frame">'+
    '<div class="scene-box">'+
      '<img class="scene-img" src="'+IMG[st.key]+'" alt="'+st.place+'场景">'+
      '<div class="scene-shade"></div>'+
      '<div class="scene-chip">'+st.place+'</div>'+
      '<div class="scene-tag">'+sceneTag(st)+'</div>'+
    '</div>'+
    '<div class="panel">'+body+'</div>'+
  '</div>';
}
function sceneTag(st){
  return st.tag||'';
}

  const sub=st.subs[S.sub];
  const opts=sub.opts.map(function(o,i){
    const dis=S.wrongOpts.indexOf(i)>-1;
    return '<button class="opt'+(dis?' bad':'')+'" type="button" onclick="optClick('+i+')"'+(dis?' disabled':'')+'><span class="no">'+(dis?'×':String(i+1))+'</span><span>'+o.t+'</span></button>';
  }).join('');
  return '<div class="panel-head"><span class="stage-no">第'+st.id+'关</span><h2>'+st.name+'</h2><span class="sub-prog">环节 '+(S.sub+1)+' / '+st.subs.length+'</span></div>'+
    '<p class="scene-text">'+sub.q+'</p>'+
    '<div class="opts">'+opts+'</div>'+
    '<div class="hint'+(S.hint.cls?' '+S.hint.cls:'')+'" id="hint">'+S.hint.txt+'</div>';
}
function optClick(i){
  if(S.locked){return;}
  const st=CONFIG.stages[S.stage];const sub=st.subs[S.sub];
  if(!sub){return;}
  const o=sub.opts[i];
  if(S.wrongOpts.indexOf(i)>-1){return;}
  S.tries++;
  if(o.ok){
    S.score+=10;S.locked=true;
    setHint('选择正确，品质分 +10','ok');
    openKnow(sub.know,function(){S.locked=false;advanceSub();});
  }else{
    S.score=Math.max(0,S.score-5);S.wrongOpts.push(i);
    setHint(o.bad);render();
  }
}
function advanceSub(){
  const st=CONFIG.stages[S.stage];
  S.sub++;S.wrongOpts=[];S.hint={txt:'',cls:''};
  if(S.sub>=st.subs.length){S.locked=true;stageClear(st);}
  else{render();}
}
function stageClear(st){
  S.locked=true;
  const ov=document.createElement('div');
  ov.className='clear-overlay';
  ov.innerHTML='<div class="big">'+st.clear+'</div><div class="sub">'+st.clearSub+'</div>';
  document.body.appendChild(ov);
  setTimeout(function(){
    ov.remove();
    openKnow(st.know,function(){nextStage();});
  },1400);
}
function nextStage(){
  S.locked=false;
  S.stage++;S.sub=0;S.wrongOpts=[];S.line=null;S.lineQ=0;S.tasted=[];S.lineDone={ancient:false,modern:false};S.sliderVal={};S.hint={txt:'',cls:''};
  if(S.stage>=CONFIG.stages.length){finish();}
  else{
    const st=CONFIG.stages[S.stage];
    if(st.type==='sliders'){st.sliders.forEach(function(s,i){S.sliderVal[i]=Math.round((s.good[0]+s.good[1])/2);});}
    render();
  }
}
function setHint(txt,cls){
  S.hint={txt:txt||'',cls:cls||''};
  const h=document.getElementById('hint');
  if(h){h.textContent=S.hint.txt;h.className='hint'+(S.hint.cls?' '+S.hint.cls:'');}
}

/* ---------- 制茶滑块关 ---------- */
function slidersBody(st){
  const rows=st.sliders.map(function(s,i){
    const v=S.sliderVal[i]!=null?S.sliderVal[i]:Math.round((s.good[0]+s.good[1])/2);
    return '<div class="slider-row" id="slrow'+i+'">'+
      '<div class="slider-head"><span class="nm">'+s.name+'</span><span class="val">'+v+' '+s.unit+'</span></div>'+
      '<input type="range" min="'+s.min+'" max="'+s.max+'" step="1" value="'+v+'" oninput="setSlider('+i+',this.value)" aria-label="'+s.name+'">'+
      '<div class="slider-err" id="slerr'+i+'"></div>'+
    '</div>';
  }).join('');
  return '<div class="panel-head"><span class="stage-no">第'+st.id+'关</span><h2>'+st.name+'</h2><span class="sub-prog">参数调控</span></div>'+
    '<p class="scene-text">调控杀青、揉捻、渥堆三个环节的参数，让每一道工序都恰到好处。</p>'+
    '<div class="opts">'+rows+'</div>'+
    '<button class="btn-primary" type="button" onclick="submitSliders()" style="align-self:center">开始制茶</button>'+
    '<div class="hint'+(S.hint.cls?' '+S.hint.cls:'')+'" id="hint">'+S.hint.txt+'</div>';
}
function setSlider(i,v){
  S.sliderVal[i]=parseInt(v,10);
  const row=document.getElementById('slrow'+i);
  const val=row.querySelector('.val');val.textContent=v+' '+CONFIG.stages[S.stage].sliders[i].unit;
  row.classList.remove('bad');
  const err=document.getElementById('slerr'+i);err.textContent='';
}
function submitSliders(){
  if(S.locked){return;}
  const st=CONFIG.stages[S.stage];let allGood=true;let firstBad='';
  st.sliders.forEach(function(s,i){
    const v=S.sliderVal[i];
    const row=document.getElementById('slrow'+i);const err=document.getElementById('slerr'+i);
    row.classList.remove('bad');err.textContent='';
    if(v==null||v<s.good[0]||v>s.good[1]){
      allGood=false;row.classList.add('bad');
      err.textContent=v<s.good[0]?s.lo:s.hi;
      if(!firstBad){firstBad=s.name;}
    }
  });
  S.tries++;
  if(allGood){
    S.score+=10;S.locked=true;
    setHint('三道工序恰到好处，品质分 +10','ok');
    stageClear(st);
  }else{
    setHint('“'+firstBad+'”没有到位，调整后再试（可返回重调）');
  }
}

/* ---------- 陈化品茶关 ---------- */
function tasteBody(st){
  const btns=st.tastes.map(function(t){
    const done=S.tasted.indexOf(t.key)>-1;
    return '<button class="taste-btn'+(done?' done':'')+'" type="button" onclick="tasteIt(\''+t.key+'\')"><span class="swatch" style="background:'+t.color+'"></span><span>'+t.label+(done?'（已品鉴）':'')+'</span></button>';
  }).join('');
  const cur=S.tasted.length?st.tastes.filter(function(t){return t.key===S.tasted[S.tasted.length-1];})[0]:null;
  const note=cur?'<div class="taste-note"><b>'+cur.label+' · '+cur.t+'</b><br>'+cur.d+'</div>':'<div class="taste-note">三款茶汤颜色由浅入深，先各品一盏，看看光阴如何改变滋味。</div>';
  let quiz='';
  if(S.tasted.length>=3){
    const qopts=st.quiz.opts.map(function(o,i){
      const dis=S.wrongOpts.indexOf(i)>-1;
      return '<button class="opt'+(dis?' bad':'')+'" type="button" onclick="quizClick('+i+')"'+(dis?' disabled':'')+'><span class="no">'+(dis?'×':String(i+1))+'</span><span>'+o.t+'</span></button>';
    }).join('');
    quiz='<div><p class="scene-text" style="font-size:.98rem">'+st.quiz.q+'</p><div class="opts">'+qopts+'</div></div>';
  }else{
    quiz='<div class="quiz-lock">品完三款茶后，将解锁“年份辨识”挑战。</div>';
  }
  return '<div class="panel-head"><span class="stage-no">第'+st.id+'关</span><h2>'+st.name+'</h2><span class="sub-prog">品鉴 '+S.tasted.length+' / 3</span></div>'+
    '<p class="scene-text">毛茶入仓陈化。六堡茶讲究“越陈越香”，从新茶到七年陈，一盏一盏品过去。</p>'+
    '<div class="taste-grid">'+btns+'</div>'+note+quiz+
    '<div class="hint'+(S.hint.cls?' '+S.hint.cls:'')+'" id="hint">'+S.hint.txt+'</div>';
}
function tasteIt(k){
  if(S.locked){return;}
  const st=CONFIG.stages[S.stage];
  if(S.tasted.indexOf(k)>-1){render();return;}
  S.tasted.push(k);
  const t=st.tastes.filter(function(x){return x.key===k;})[0];
  setHint('品鉴“'+t.label+'”：'+t.d,'ok');
  render();
}
function quizClick(i){
  if(S.locked){return;}
  const st=CONFIG.stages[S.stage];const o=st.quiz.opts[i];
  if(S.wrongOpts.indexOf(i)>-1){return;}
  S.tries++;
  if(o.ok){
    S.score+=10;S.locked=true;
    setHint('辨识正确，品质分 +10','ok');
    stageClear(st);
  }else{
    S.score=Math.max(0,S.score-5);S.wrongOpts.push(i);
    setHint(o.bad);render();
  }
}

/* ---------- 卖茶双线关 ---------- */
function dualBody(st){
  if(S.line){
    const line=st.lines.filter(function(l){return l.key===S.line;})[0];
    const sub=line.subs[S.lineQ];
    const opts=sub.opts.map(function(o,i){
      const dis=S.wrongOpts.indexOf(i)>-1;
      return '<button class="opt'+(dis?' bad':'')+'" type="button" onclick="lineOpt('+i+')"'+(dis?' disabled':'')+'><span class="no">'+(dis?'×':String(i+1))+'</span><span>'+o.t+'</span></button>';
    }).join('');
    return '<div class="panel-head"><span class="stage-no">第'+st.id+'关</span><h2>'+line.name+'</h2><span class="sub-prog">支线 '+(S.lineQ+1)+' / '+line.subs.length+'</span></div>'+
      '<button class="line-back" type="button" onclick="backToLines()">← 返回选择另一条路</button>'+
      '<p class="scene-text">'+sub.q+'</p>'+
      '<div class="opts">'+opts+'</div>'+
      '<div class="hint'+(S.hint.cls?' '+S.hint.cls:'')+'" id="hint">'+S.hint.txt+'</div>';
  }
  const tabs=st.lines.map(function(l){
    const on=S.lineDone[l.key];
    return '<button class="line-tab'+(on?' on':'')+'" type="button" onclick="enterLine(\''+l.key+'\')">'+
      svgIcon(l.key==='ancient'?'boat':'cart')+
      '<b>'+l.name+(on?'（已完成）':'')+'</b><small>'+l.desc+'</small></button>';
  }).join('');
  return '<div class="panel-head"><span class="stage-no">第'+st.id+'关</span><h2>'+st.name+'</h2><span class="sub-prog">双线剧情</span></div>'+
    '<p class="scene-text">好茶在手，如何把它送出六堡镇、名扬四方？两条路都要走一走——先选一条。</p>'+
    '<div class="line-tabs">'+tabs+'</div>'+
    '<div class="hint'+(S.hint.cls?' '+S.hint.cls:'')+'" id="hint">'+S.hint.txt+'</div>';
}
function enterLine(k){
  if(S.locked){return;}
  S.line=k;S.lineQ=0;S.wrongOpts=[];S.hint={txt:'',cls:''};
  render();
}
function backToLines(){
  if(S.locked){return;}
  S.line=null;S.wrongOpts=[];S.hint={txt:'',cls:''};
  render();
}
function lineOpt(i){
  if(S.locked){return;}
  const st=CONFIG.stages[S.stage];
  const line=st.lines.filter(function(l){return l.key===S.line;})[0];
  const sub=line.subs[S.lineQ];const o=sub.opts[i];
  if(S.wrongOpts.indexOf(i)>-1){return;}
  S.tries++;
  if(o.ok){
    S.score+=10;S.lineQ++;S.wrongOpts=[];
    if(S.lineQ>=line.subs.length){
      S.lineDone[S.line]=true;S.line=null;S.lineQ=0;S.wrongOpts=[];
      const both=S.lineDone.ancient&&S.lineDone.modern;
      S.locked=true;
      openKnow(line.know,function(){
        if(both){stageClear(st);}
        else{S.locked=false;render();}
      });
    }else{render();}
  }else{
    S.score=Math.max(0,S.score-5);S.wrongOpts.push(i);
    setHint(o.bad);render();
  }
}

/* ---------- 结算页 ---------- */
function finish(){
  S.view='result';
  render();
  const h=document.getElementById('hscroll');
  if(h){h.scrollLeft=0;}
}
function rankOf(){
  if(S.score>=95){return {t:'六堡茶圣',d:'百炼成茶，一盏封神'};}
  if(S.score>=80){return {t:'制茶大师',d:'火候于心，行云流水'};}
  if(S.score>=60){return {t:'熟练茶农',d:'踏遍青山，手艺渐成'};}
  return {t:'茶路学徒',d:'茶路漫漫，来日方长'};
}
function starSVG(fill){
  const f=fill?'#c9a15f':'#e6dcc0';
  return '<svg viewBox="0 0 24 24"><path fill="'+f+'" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
}
function renderResult(){
  const r=rankOf();
  const n=Math.max(1,Math.min(5,Math.round(S.score/24)));
  const stars=[0,1,2,3,4].map(function(i){return starSVG(i<n);}).join('');
  const chips=CONFIG.stages.map(function(s){return '<span class="on">'+s.id+' '+s.name+'</span>';}).join('');
  const nodes=HISTORY.map(function(h,i){
    return '<div class="hnode"><div class="dot"></div><div class="yr">'+h.y+'</div><div class="tt">'+h.t+'</div><div class="dd">'+h.d+'</div></div>';
  }).join('');
  const sealChars=r.t.length===4?r.t.slice(0,2)+'<br>'+r.t.slice(2):r.t;
  app.innerHTML=
  '<section class="result-head frame" style="padding-bottom:22px">'+
    '<div class="seal">'+sealChars+'</div>'+
    '<div class="rank-name">'+r.t+'</div>'+
    '<div class="rank-desc">'+r.d+'</div>'+
    '<div class="stars">'+stars+'</div>'+
    '<div class="stats">'+
      '<div><div class="n">'+S.score+'</div><div class="l">品质分</div></div>'+
      '<div><div class="n">'+S.tries+'</div><div class="l">操作次数</div></div>'+
      '<div><div class="n">'+CONFIG.stages.length+' / '+CONFIG.stages.length+'</div><div class="l">通关关卡</div></div>'+
    '</div>'+
    '<div class="stage-chips">'+chips+'</div>'+
  '</section>'+
  '<section class="history">'+
    '<h2>六堡茶历史长卷</h2>'+
    '<div class="hscroll" id="hscroll"><div class="hline"></div><div class="hnodes">'+nodes+'</div></div>'+
    '<div class="hnav"><button type="button" onclick="scrollH(-1)" aria-label="向前翻">‹</button><button type="button" onclick="scrollH(1)" aria-label="向后翻">›</button></div>'+
  '</section>'+
  '<div class="result-actions">'+
    '<button class="btn-primary" type="button" onclick="startGame()">再玩一次</button>'+
    '<button class="btn-ghost" type="button" onclick="goHome()">回到主页</button>'+
  '</div>';
}
function scrollH(dir){
  const h=document.getElementById('hscroll');
  if(h){h.scrollBy({left:dir*216,behavior:'smooth'});}
}

/* ---------- 知识弹窗 ---------- */
function openKnow(k,cb){
  const mask=document.createElement('div');
  mask.className='modal-mask';
  mask.innerHTML='<div class="modal" role="dialog" aria-label="知识点">'+
    '<div class="modal-seal">知</div>'+
    '<h3>知识点 · '+k.t+'</h3>'+
    '<p>'+k.d+'</p>'+
    '<button class="btn-primary" type="button">继续</button>'+
  '</div>';
  mask.querySelector('button').addEventListener('click',function(){
    mask.remove();
    if(cb){cb();}
  });
  mask.addEventListener('click',function(e){
    if(e.target===mask){mask.remove();if(cb){cb();}}
  });
  document.body.appendChild(mask);
  const btn=mask.querySelector('button');if(btn){btn.focus();}
}

/* ---------- 导航 ---------- */
function startGame(){resetState();render();}
function goHome(){S.view='start';render();}

/* ---------- 启动 ---------- */
render();
</script>

/* PWA 离线缓存注册（file:// 下自动跳过） */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
